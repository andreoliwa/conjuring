]
# The autogenerated changelogs constantly violate lint rules.
# Native exclusions also apply to filenames passed explicitly by pre-commit.
exclude = ["CHANGELOG.md", "docs/CHANGELOG.md"]

[MD010]
code-blocks = true

# Keep line-length checks on tables as well as prose.
[MD013]
tables = true

# Duplicate headings are checked across the whole document.
[MD024]
siblings-only = false

[MD046]
style = "consistent"

# Preserve the previous default: do not enforce table column alignment.
[MD060]
style = "any"

# Documentation uses indented admonitions, not indented code blocks.
[per-file-flavor]
"docs/**/*.md" = "mkdocs"
